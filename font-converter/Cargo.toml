[package]
name = "kmrp-font-converter"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
description = "Turns any font file into KOTOR's game fonts, for KMRP or the original game"
license = "GPL-3.0-or-later"
authors = ["RaymanGT"]
repository = "https://github.com/RayesDiyab/KOTOR-KMRP-Font-Converter"
publish = false
build = "build.rs"

[[bin]]
name = "kmrp-font-converter"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
skrifa = "0.49"
wuff = "0.2"
miniz_oxide = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = { version = "0.18", default-features = false, features = ["xdg-portal", "pollster", "common-controls-v6"] }
dirs = "6"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The unit tests, in their own profile, so they never change the release build (as KMSE).
[profile.tests]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
panic = "unwind"
strip = false
