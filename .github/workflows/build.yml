# Checks the KMRP Font Converter on Windows, macOS and Linux: it compiles, its unit tests
# pass, and the regression test (tests/Test-FontConverter.py: every font type into both
# versions, and what it must refuse) passes; and every relative link in the documents
# resolves.
#
# Tests only. The release packages (the Windows exe and zip, the macOS app, DMG and zip, the
# Linux AppImages) are built on the maintainer's machines with build.ps1, build-macos.sh and
# build-linux.sh, not here (2026-11-09, the maintainer: "dont build the actual release just
# make the ci run tests", as KMSE's CI). The program the regression test runs is built with
# the tests profile (Cargo.toml: optimized, no LTO, quicker to build), not as a release.
name: Font Converter

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: font-converter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install fonttools brotli pillow
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: font-converter -> build/target
      - name: Unit tests
        run: cargo test --profile tests --locked
      - name: Build for the regression test
        run: cargo build --profile tests --locked
      - name: Regression test (Windows)
        if: runner.os == 'Windows'
        run: python ../tests/Test-FontConverter.py --exe build/target/tests/kmrp-font-converter.exe
      - name: Regression test
        if: runner.os != 'Windows'
        run: python ../tests/Test-FontConverter.py --exe build/target/tests/kmrp-font-converter

  links:
    name: Documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/check_links.py
